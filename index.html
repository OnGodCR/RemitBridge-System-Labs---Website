<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>RemitBridge Systems Lab</title>
    <meta
      name="description"
      content="A student research lab measuring what cross-border transfers actually cost, and testing whether newer payment rails can do it cheaper."
    />

    <!-- Tab icon. SVG first for modern browsers, PNGs for the rest. -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32x32.png" sizes="32x32" type="image/png" />
    <link rel="icon" href="/favicon-16x16.png" sizes="16x16" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#14705A" />

    <!--
      Link previews. og:url and og:image must be absolute URLs — crawlers do
      not resolve relative paths. %SITE_URL% is filled in at build time by the
      site-url plugin in vite.config.js, from the Vercel production domain.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="RemitBridge Systems Lab" />
    <meta property="og:title" content="RemitBridge Systems Lab" />
    <meta
      property="og:description"
      content="A student research lab measuring what cross-border transfers actually cost, and testing whether newer payment rails can do it cheaper."
    />
    <meta property="og:url" content="%SITE_URL%/" />
    <meta property="og:image" content="%SITE_URL%/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="RemitBridge Systems Lab — measuring what it really costs to send money home."
    />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="RemitBridge Systems Lab" />
    <meta
      name="twitter:description"
      content="A student research lab measuring what cross-border transfers actually cost, and testing whether newer payment rails can do it cheaper."
    />
    <meta name="twitter:image" content="%SITE_URL%/og-image.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
